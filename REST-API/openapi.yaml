openapi: 3.0.1
info:
  title: ROBA Gateway
  description: OpenAPI documentation for ROBA Gateway REST communication. This API allows interaction with the ROBA Gateway and ROBA® brake-checker® (RBC) for configuration, monitoring, and control.
  contact:
    email: public@mayr.de
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0

servers:
  - url: 192.168.4.2

tags:
  - name: Gateway
    description: Operations related to the ROBA Gateway, including configuration, monitoring, and control.
  - name: RBC
    description: Operations related to the ROBA® brake-checker® (RBC), including configuration and status monitoring.

paths:
  /Login:
    put:
      tags:
        - Gateway
      operationId: putLogin
      description: Authenticate using username and password. Returns 200 on success, 401 on failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/NotAuthorized"
  /Gateway/ConfigAssistant:
    get:
      tags:
        - Gateway
      operationId: getGatewayConfigAssistant
      description: Retrieve the current status of the configuration assistant.
      responses:
        "200":
          $ref: "#/components/responses/OnOff"
    put:
      tags:
        - Gateway
      operationId: putGatewayConfigAssistant
      description: Enable or disable the web interface configuration assistant.
      security:
        - basicAuth: ["Customer"]
      requestBody:
        $ref: "#/components/requestBodies/OnOff"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
  /Gateway/FactoryReset:
    put:
      tags:
        - Gateway
      operationId: putGatewayFactoryReset
      description: Perform a factory reset to restore the gateway to its default settings.
      security:
        - basicAuth: ["Service"]
      responses:
        "202":
          $ref: "#/components/responses/RequestAccepted"
        "401":
          $ref: "#/components/responses/NotAuthorized"
  /Gateway/GlobalLogLevel:
    get:
      tags:
        - Gateway
      operationId: getGatewayGlobalLogLevel
      description: Retrieve the current global log level of the gateway. The log level determines the verbosity of the logs generated by the system.
      responses:
        "200":
          $ref: "#/components/responses/LogLevel"
    put:
      tags:
        - Gateway
      operationId: putGatewayGlobalLogLevel
      description: Update the global log level of the gateway.
      security:
        - basicAuth: ["Service"]
      requestBody:
        $ref: "#/components/requestBodies/LogLevel"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
  /Gateway/Id:
    get:
      tags:
        - Gateway
      description: Get Gateway item- and serial numbers
      operationId: getGatewayId
      responses:
        "200":
          $ref: "#/components/responses/Id"
  /Gateway/IrDAEnable:
    get:
      tags:
        - Gateway
      description: Get IrDA enable state
      operationId: getGatewayIrDAEnable
      responses:
        "200":
          $ref: "#/components/responses/OnOff"
  /Gateway/Input/{channel}:
    get:
      tags:
        - Gateway
      description: Get the state of an input from the gateway
      operationId: getGatewayInput
      parameters:
        - $ref: "#/components/parameters/Channel"
      responses:
        "200":
          $ref: "#/components/responses/OnOff"
  /Gateway/ModuleId:
    get:
      tags:
        - Gateway
      description: Get Gateway Hardware ID (mac address)
      operationId: getGatewayModuleId
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ModuleId:
                    type: string
                    description: ModuleId
  /Gateway/MqttSettings:
    get:
      tags:
        - Gateway
      description: Get the actual MQTT settings from the gateway
      operationId: getGatewayMqttSettings
      responses:
        "200":
          $ref: "#/components/responses/MqttSettings"
    put:
      security:
        - basicAuth: ["Service"]
      tags:
        - Gateway
      description: Set the new MQTT settings for the gateway
      operationId: putGatewayMqttSettings
      requestBody:
        $ref: "#/components/requestBodies/MqttSettings"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
  /Gateway/Network:
    get:
      tags:
        - Gateway
      description: Get Gateway network settings
      operationId: getGatewayNetwork
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkSettings"
    put:
      security:
        - basicAuth: ["Service"]
      tags:
        - Gateway
      description: Set Gateway network settings
      operationId: putGatewayNetwork
      requestBody:
        description: Network settings to update
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkSettings"
        required: true
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
  /Gateway/OneWireData:
    get:
      tags:
        - Gateway
      description: Get the one wire connection info of the gateway
      operationId: getGatewayOneWireData
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneWireData"
  /Gateway/OneWireSettings:
    get:
      tags:
        - Gateway
      description: Get the one wire settings of the gateway
      operationId: getGatewayOneWireSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneWireSettings"
    put:
      security:
        - basicAuth: ["Service"]
      tags:
        - Gateway
      description: Set the one wire settings of the gateway
      operationId: putGatewayOneWireSettings
      requestBody:
        description: The one wire settings to update
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneWireSettings"
        required: true
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
  /Gateway/Output/{channel}:
    get:
      tags:
        - Gateway
      description: Get the state of an output from the gateway
      operationId: getGatewayOutput
      parameters:
        - $ref: "#/components/parameters/Channel"
      responses:
        "200":
          $ref: "#/components/responses/OnOff"
    put:
      security:
        - basicAuth: ["Customer"]
      tags:
        - Gateway
      description: Set an output of the gateway
      operationId: putGatewayOutput
      parameters:
        - $ref: "#/components/parameters/Channel"
      requestBody:
        $ref: "#/components/requestBodies/OnOff"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
  /Gateway/PCBSerialNumber:
    get:
      tags:
        - Gateway
      description: Get Gateway PCB serial number
      operationId: getGatewayPCBSerialNumber
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PCBSerialNumber"
  /Gateway/Ping:
    get:
      tags:
        - Gateway
      description: Send ping to gateway
      operationId: getGatewayPing
      responses:
        "200":
          description: Pong
  /Gateway/Restart:
    put:
      security:
        - basicAuth: ["Customer"]
      tags:
        - Gateway
      description: Restart Gateway
      operationId: putGatewayRestart
      responses:
        "202":
          $ref: "#/components/responses/RequestAccepted"
        "401":
          $ref: "#/components/responses/NotAuthorized"
  /Gateway/SDInfo:
    get:
      tags:
        - Gateway
      description: Get Gateway SD card information
      operationId: getGatewaySDInfo
      responses:
        "200":
          $ref: "#/components/responses/SdInfo"
  /Gateway/ToslinkSettings:
    get:
      tags:
        - Gateway
      description: Get the toslink settings of the gateway
      operationId: getGatewayToslinkSettings
      responses:
        "200":
          $ref: "#/components/responses/ToslinkSettings"
    put:
      security:
        - basicAuth: ["Service"]
      tags:
        - Gateway
      description: Set toslink settings of the gateway
      operationId: putGatewayToslinkSettings
      requestBody:
        $ref: "#/components/requestBodies/ToslinkSettings"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
  /Gateway/Uptime:
    get:
      tags:
        - Gateway
      description: Get the runtime counter of the gateway (uptime)
      operationId: getGatewayUptime
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Value:
                    type: integer
                    format: uint32
                    description: The gateway uptime in seconds
  /Gateway/Version:
    get:
      tags:
        - Gateway
      description: Get Gateway HW/SW versions
      operationId: getGatewayVersion
      responses:
        "200":
          $ref: "#/components/responses/Version"

  /RBC/CurrentValues:
    get:
      tags:
        - RBC
      description: Returns the current values of the RBC like voltage, current etc.
      operationId: getRBCCurrentValues
      responses:
        "200":
          $ref: "#/components/responses/RBCCurrentValues"
  /RBC/Config:
    get:
      tags:
        - RBC
      description: Get the current RBC configuration
      operationId: getRBCConfig
      responses:
        "200":
          $ref: "#/components/responses/RBCConfig"
    put:
      security:
        - basicAuth: ["Service"]
      tags:
        - RBC
      description: Set the new RBC configuration
      operationId: putRBCConfig
      requestBody:
        $ref: "#/components/requestBodies/RBCConfig"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/NotAuthorized"
  /RBC/CycleData:
    get:
      tags:
        - RBC
      description: Get the last recorded cycle data values
      operationId: getRBCCycleData
      responses:
        "200":
          $ref: "#/components/responses/RBCCycleData"
  /RBC/Info:
    get:
      tags:
        - RBC
      description: Get the RBC information like type, name, serial number etc.
      operationId: getRBCInfo
      responses:
        "200":
          $ref: "#/components/responses/RBCInfo"
  /RBC/Reset:
    put:
      security:
        - basicAuth: ["Customer"]
      tags:
        - RBC
      description: Reset the roba brake checker
      operationId: putRBCReset
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/NotAuthorized"
  /RBC/TransmitRate:
    get:
      tags: 
        - RBC
      description: Get the current RBC transmit rate value in milliseconds
      operationId: getRBCTransmitRate
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Value:
                    type: integer
                    description: The current transmit rate in milliseconds
                    minimum: 0
                    maximum: 65535

components:
  responses:
    BadRequest:
      description: The request body is malformed or invalid. Verify the request payload.
    Id:
      description: 200 OK
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Id"
    NotAuthorized:
      description: The request is unauthorized. Ensure proper authentication credentials are provided.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: A message indicating the reason for unauthorized access.
    MqttSettings:
      description: Get the gateway MQTT settings
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MqttSettings"
    NoContent:
      description: The operation was successful, and no content is returned.
    OnOff:
      description: Indicates whether a setting is enabled (on) or disabled (off).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OnOff"
    RequestAccepted:
      description: The request has been accepted for processing but is not yet complete.
    SdInfo:
      description: Get gateway SD card information
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SdInfo"
    ToslinkSettings:
      description: Toslink settings
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ToslinkSettings"
    Version:
      description: 200 OK
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Version"
    RBCCurrentValues:
      description: 200 OK
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RBCCurrentValues"
    RBCConfig:
      description: 200 OK
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RBCConfig"
    RBCCycleData:
      description: 200 OK
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RBCCycleData"
    RBCInfo:
      description: 200 OK
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RBCInfo"
    LogLevel:
      description: The current log level of the gateway.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LogLevel"

  requestBodies:
    MqttSettings:
      description: Set the MQTT settings of the gateway
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MqttSettings"
    OnOff:
      description: Payload to enable or disable a setting.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OnOff"
    ToslinkSettings:
      description: Get gateway toslink settings
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ToslinkSettings"
    RBCConfig:
      description: Set the new config for the RBC device
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RBCConfig"
    LogLevel:
      description: Payload to set the log level of the gateway.
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LogLevel"

  schemas:
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    Id:
      type: object
      description: Get or set the item and serial numbers. This requires a special authorization.
      properties:
        SerialNumber:
          type: string
          description: This is the mayr serial number. Example 2450D00133
          minLength: 8
          maxLength: 16
        ItemNumber:
          type: string
          description: This is the mayr item number. Example 8298350
          minLength: 7
          maxLength: 16
    LogLevel:
      type: object
      description: Represents the log level configuration.
      properties:
        Value:
          type: integer
          description: Log level (0 = Verbose, 1 = Debug, 2 = Information, 3 = Warning, 4 = Error, 5 = Fatal).
          minimum: 0
          maximum: 5
    MqttSettings:
      type: object
      description: Get one wire sensor configuration of the gateway
      properties:
        Mqtt:
          type: object
          properties:
            Enabled:
              type: boolean
              description: True if MQTT is enabled, false otherwise
            Broker:
              type: string
              description: The hostname or IP address of the MQTT broker
            Port:
              type: number
              format: uint16
              description: The MQTT port
            Topic:
              type: string
              description: The basic topic for the MQTT client
            DiscoTopic:
              type: string
              description: The auto discovery topic of the MQTT broker
            Username:
              type: string
              description: The username for the MQTT broker
            Password:
              type: string
              description: The password for the MQTT broker
    NetworkSettings:
      type: object
      properties:
        hostname:
          type: string
          minLength: 0
          maxLength: 4000
        NetworkType:
          type: number
          format: uint8
          description: Configure the type of network. 0 = disabled, 1 = static IP, 2 = DHCP client
          minimum: 0
          maximum: 2
        dynamicIp:
          type: string
          description: Represents the IP address assigned by the DHCP server. This value is read only
        dynamicSubnetMask:
          type: string
          description: Represents the subnet mask assigned by the DHCP server. This value is read only
        dynamicGateway:
          type: string
          description: Represents the address of the DHCP server. This value is read only
        dynamicDNS1:
          type: string
          description: Represents the DNS server 1 assigned by the DHCP server. This value is read only
        dynamicDNS2:
          type: string
          description: Represents the DNS server 2 assigned by the DHCP server. This value is read only
        StaticIP:
          type: object
          description: Configure the static IP address of the gateway
          properties:
            StaticIPAddress:
              type: string
              minLength: 0
              maxLength: 4000
            StaticSubnet:
              type: string
              minLength: 0
              maxLength: 4000
            StaticGateway:
              type: string
              minLength: 0
              maxLength: 4000
            StaticDNS1:
              type: string
              minLength: 0
              maxLength: 4000
            StaticDNS2:
              type: string
              minLength: 0
              maxLength: 4000
        NtpSettings:
          type: object
          description: Configure NTP client/server settings
          properties:
            Enabled:
              type: boolean
            Server:
              type: string
              description: An IP address or hostname representing the NTP server to request the time
              minLength: 0
              maxLength: 4000
    OneWireData:
      type: object
      description: Get one wire sensor information of the gateway
      properties:
        Name:
          type: string
          description: This is the name of the one wire device
        Temperature:
          type: number
          format: float
          description: This is the temperature of the one wire device.
        Humidity:
          type: number
          format: float
          description: This value is only available in case a sensor with humidity capability is connected
    OneWireSettings:
      type: object
      description: Get one wire sensor configuration of the gateway
      properties:
        OneWire:
          type: object
          properties:
            Enabled:
              type: boolean
              description: Enables or disables the 1-Wire peripheral
            TempOffset:
              type: number
              format: float
              description: This is the temperature offset of the one wire device
            HumOffset:
              type: number
              format: float
              description: This is the humidity offset of the one wire device
    OnOff:
      type: object
      description: Represents a binary state (on/off).
      properties:
        Value:
          type: boolean
          description: True for on, false for off.
      required:
        - Value
    PCBSerialNumber:
      type: object
      description: Get or set the PCB serial number
      properties:
        Value:
          type: string
          description: This is the PCB serial number
          minLength: 1
          maxLength: 16
    SdInfo:
      type: object
      description: Get gateway SD card information
      properties:
        SDCard:
          type: object
          properties:
            CardType:
              type: number
              format: uint8
              description: 0 = No card, 1 = MMC, 2 = SD, 3 = SDHC, 4 = Unknown card type
              minimum: 0
              maximum: 4
            TotalBytes:
              type: number
              format: uint64
              description: The SD card capacity in bytes
            UsedBytes:
              type: number
              format: uint64
              description: The number of used bytes of SD card
            FreeBytes:
              type: number
              format: uint64
              description: The number of free bytes on the SD card
    ToslinkSettings:
      type: object
      description: Get or set the gateway toslink settings
      properties:
        Toslink:
          type: object
          properties:
            Enabled:
              type: boolean
              description: This value indicates if the toslink is enabled or not
      additionalProperties: true
    Version:
      type: object
      description: Get or set the hardware and software versions (software is read only). This requires a special authorization.
      properties:
        HwVersion:
          type: string
          description: example 0.1.0.0
          maxLength: 15
          minLength: 7
        SwVersion:
          type: string
          description: example 1.0.5 please note that this version is read only
          maxLength: 11
          minLength: 5

    RBCErrorCode:
      type: number
      format: uint8
      description: The actual error code of the RBC
      minimum: 0
      maximum: 16
    RBCCurrentValues:
      type: object
      description: Get the latest cycle data of the RBC. This object is read only.
      properties:
        Connected:
          type: boolean
          description: Indicates if a RBC has detected by the gateway or not.
        Voltage:
          type: number
          format: float
          description: The actual output voltage of the RBC
        Current:
          type: number
          format: float
          description: The actual output current of the RBC
        State:
          type: number
          format: uint8
          description: 0 = Idle state
            1 = Energizing state 1
            2 = Energizing state 2
            3 = Hold state
            4 = De-energizing state
            5 = Error state
          minimum: 0
          maximum: 5
        ErrorCode:
          $ref: "#/components/schemas/RBCErrorCode"
        Error:
          type: boolean
          description: This is the RBC error flag. It reflects the RBC error output state. This value is true if "no error" is detected, false otherwise
        SlowFast:
          type: boolean
          description: True = fast switching mode enabled, false = disabled
        Input:
          type: boolean
          description: This is the RBC input flag. It reflects the physical RBC input state.
        Output:
          type: boolean
          description: This is the RBC output flag. It reflects the physical RBC output state.
        Signal:
          type: boolean
          description: This is the RBC signal flag. It reflects the RBC physical signal output state. This value is true if the signal is active, false otherwise
        Start:
          type: boolean
          description: This is the RBC start flag. This value is true if the input is active, false otherwise
        Warn:
          type: boolean
          description: This is the RBC warning flag. It reflects the RBC warning output state (depends on the RBC type). This value is true if a warning is active, false otherwise.
    RBCConfig:
      type: object
      description: Get or set the RBC configuration
      properties:
        ID:
          type: number
          format: uint8
          description: Brake checker identifier
             0x10 = RBC DC
             0x20 = RBC plus DC 24V
             0x25 = RBC plus DC 48V
             0x30 = RBC AC
             0x40 = RBC plus AC
        ControlType:
          type: number
          format: uint8
          description: 
            0x00 = Not available
            0x01 = half-wave rectifiers
            0x02 = Bridge rectifier
            0x04 = ROBA Switch
            0x08 = Multi Switch
            0x20 = RBC plus DC
            0x40 = RBC plus AC
        ControlMode:
          type: number
          format: uint8
          description: 0 = disabled
            1 = voltage control mode
            2 = current control mode
            4 = voltage/current control mode
          minimum: 0
          maximum: 4
        Overexcitation:
          type: number
          format: float
          description: Overexcitation voltage/current in V/A
        Holding:
          type: number
          format: float
          description: Holding voltage/current in V/A
        CoilVoltage:
          type: number
          format: float
          description: nominal coil voltage
        OexcTime:
          type: number
          format: uint16
          description: The overexcitation time for the brake checker in milliseconds. Set to 0 to set up automaic overexcitation time
        ArmDiscCondRec:
          type: boolean
          description: enable armature disk condition recognition
        SoftStart:
          type: boolean
          description: enable 60ms startup ramp for LBE brakes
        DampedBrake:
          type: boolean
          description: damped brake
        FreeWheelingVoltage:
          type: number
          format: uint8
          description: freewheeling voltage 0=100% / 1=75% / 2=50% / 3=25% varistor voltage
        ScopeMode:
          type: boolean
          description: Enable the oscilloscope functionality of the RBC
        ShutdownAutomatic:
          type: boolean
          description: Enable shutdown automatic
        PrevFuncMon:
          type: boolean
          description: Enable preventive function monitoring
    RBCCycleData:
      type: object
      description: Get the latest cycle data values
      properties:
        Timestamp:
          type: number
          format: uint64
          description: This is the timestamp in milliseconds of the cycle data package. If the unix time has been set, this value will contain the unix timestamp, otherwise the value of the system timer (starting at 0) will be set.
        OexcVoltage:
          type: number
          format: float
          description: This is the maximum overexcitation voltage of the last cycle
        OexcCurrent:
          type: number
          format: float
          description: This is the maximum overexcitation current of the last cycle
        HoldVoltage:
          type: number
          format: float
          description: This is the last holding voltage of the last cycle
        HoldCurrent:
          type: number
          format: float
          description: This is the last holding current of the last cycle
        PeakCutOff:
          type: number
          format: float
          description: This is the maximum peak cutoff "voltage" of the last cycle
        Resistance:
          type: number
          format: float
          description: This value indicates the last measured resistance of the brake coil
        FluxReserve:
          type: number
          format: float
          description: This is the calculated flux reserve of the last cycle
        CyclePower:
          type: number
          format: float
          description: This is the average power consumption of the the last cycle
        OexcTime:
          type: number
          format: float
          description: This value indicates how long the overexcitation was active
        T11:
          type: number
          format: float
          description: This is the t11 time of the last cycle.
        T2:
          type: number
          format: float
          description: This is the t2 time of the last cycle.
        CycleOnTime:
          type: number
          format: float
          description: This value indicates how long the brake was switched on. This is measured from the point where the brake is switched "on" until the brake is switched "off" again.
        CycleOffTime:
          type: number
          format: float
          description: This value indicates how long the brake was switched off. This is measured from the point where the brake is switched "off" until the brake is switched "on" again.
        SignalStrength:
          type: number
          format: float
          description: This value indicates the signal strength of the release monitoring. Values below 20% can be considered as weak signal
        ErrorCode:
          $ref: "#/components/schemas/RBCErrorCode"
        MPUTemp:
          type: number
          format: float
          description: a # TODO
    RBCInfo:
      type: object
      description: Get the RBC information data
      properties:
        Connected:
          type: boolean
          description: Indicates if a RBC has detected by the gateway or not.
        Name:
          type: string
          description: This is the name of the RBC e.g. RBC Plus DC 24V
        Type:
          type: string
          description: Returns the RBC type number e.g. 058.600.2
        SerialNumber:
          type: string
          description: This is the mayr serial number. Example 2450D00013
          minLength: 7
          maxLength: 16
        ItemNumber:
          type: string
          description: This is the mayr item number. Example 8298350
          minLength: 7
          maxLength: 16
        PCBSerialNumber:
          type: string
          description: This is the PCB serial number
          minLength: 1
          maxLength: 16
        HwVersion:
          type: string
          description: example 0.1.0.0
          maxLength: 15
          minLength: 7
        SwVersion:
          type: string
          description: example 1.0.5 please note that this version is read only
          maxLength: 11
          minLength: 5

  parameters:
    Channel:
      in: path
      name: channel
      description: Select an input or output channel
      required: true
      schema:
        type: integer
        format: uint8
        minimum: 0
        maximum: 1

  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
